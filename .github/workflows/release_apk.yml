on: workflow_dispatch

name: Build signed release apk

# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64  base64 of your .jks signing key
#   KEY_PASSWORD     the password for the keystore and key
#   KEY_ALIAS        the key alias (e.g. musify)

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17.x'

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Use the Flutter version the project pins.
      - run: |
          pip install -U yq
          echo "FLUTTER_VERSION=$(yq -r .environment.flutter pubspec.yaml | sed 's/\^//g')" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: "${{ env.FLUTTER_VERSION }}"

      # Secrets go through env vars, never inline in the script.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" \
            || { echo "Missing KEYSTORE_BASE64, KEY_PASSWORD or KEY_ALIAS secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          {
            echo "storePassword=$KEY_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze .

      # arm64 covers virtually every modern phone and is much smaller than the
      # universal APK.
      - run: flutter build apk --release --split-per-abi --target-platform="android-arm64" --flavor github

      - name: Show signing certificate
        run: |
          TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: Musify-release-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk
